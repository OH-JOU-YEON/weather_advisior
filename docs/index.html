<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>기온별 옷차림 추천</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #5568d3;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .temp-info {
            margin: 10px 0;
            font-size: 18px;
        }
        .recommendation {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌡️ 기온별 옷차림 추천</h1>
    <input id="location" placeholder="지역을 입력하세요 (예: 서울)" type="text">
    <button id="searchBtn">날씨 조회</button>
    <div id="result"></div>
</div>
<script src="kotlin-kotlin-stdlib.js"></script>
<script src="weather-clothing-advisor.js"></script>
</body>
</html>
