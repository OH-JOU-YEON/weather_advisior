<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>기온별 옷차림 추천</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
           background: #e3f2fd;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #5568d3;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .temp-info {
            margin: 10px 0;
            font-size: 18px;
        }
        .recommendation {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-left: 4px solid #667eea;
        }

        select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
    background-color: white;
    cursor: pointer;
}

select:focus {
    outline: none;
    border-color: #667eea;
}
    </style>
</head>
<body>
<div class="container">
    <h1>🌡️ 기온별 옷차림 추천</h1>
    <select id="location">
        <option value="">지역을 선택하세요</option>
        <option value="서울">서울</option>
        <option value="인천">인천</option>
        <option value="수원">수원</option>
        <option value="부산">부산</option>
        <option value="대구">대구</option>
        <option value="대전">대전</option>
        <option value="광주">광주</option>
        <option value="울산">울산</option>
        <option value="제주">제주</option>
        <option value="강릉">강릉</option>
        <option value="춘천">춘천</option>
        <option value="청주">청주</option>
        <option value="전주">전주</option>
        <option value="포항">포항</option>
        <option value="창원">창원</option>
    </select>
    <button id="searchBtn">날씨 조회</button>
    <div id="result"></div>
</div>
<script src="weather-clothing-advisor.js"></script>
</body>
</html>
